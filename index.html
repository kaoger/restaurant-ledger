<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>餐廳日結記帳</title>
<meta name="theme-color" content="#2445c8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日結記帳">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  /* layout: one-column phone app — sticky date bar on top, cards in the middle, tab bar at the bottom; ballpoint-blue ink like the paper ledger */
  --paper:#f3f5f9;
  --card:#ffffff;
  --ink:#18213d;
  --muted:#66708b;
  --line:#dfe3ed;
  --accent:#2445c8;
  --accent-soft:#e7ecfb;
  --pos:#14825a;
  --neg:#c23b29;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1220;--card:#161b2b;--ink:#e6e9f3;--muted:#97a0bb;--line:#283049;
    --accent:#7d97ff;--accent-soft:#1e2747;--pos:#48c58c;--neg:#ff7d69;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1220;--card:#161b2b;--ink:#e6e9f3;--muted:#97a0bb;--line:#283049;
  --accent:#7d97ff;--accent-soft:#1e2747;--pos:#48c58c;--neg:#ff7d69;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

header.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.sync{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync.ok{color:var(--pos);border-color:currentColor}
.sync.warn{color:var(--neg);border-color:currentColor}

.datenav{display:flex;align-items:center;gap:8px}
.ib{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px;line-height:1}
.datebtn{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:52px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.datebtn b{font-size:18px;text-wrap:balance}
.datebtn small{font-size:12px;color:var(--muted)}
.datebtn small.done{color:var(--pos)}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;cursor:pointer}
.today-btn{flex:none;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:700}

main{flex:1;padding:12px 16px 104px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:2px}
.card-h h2{margin:0;font-size:17px;font-weight:700;text-wrap:balance}
.hint{font-size:12px;color:var(--muted)}
.banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink)}
.banner.warn{border-color:var(--neg)}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row>span{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.tag{font-style:normal;font-size:11px;padding:0 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.tag.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
input.amt{width:132px;flex:none;text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:18px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
input.txt{flex:1;min-width:0;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea{width:100%;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);resize:vertical}

.total{display:flex;align-items:baseline;justify-content:space-between;padding-top:8px;margin-top:4px;border-top:2px solid var(--ink)}
.total span{font-weight:700}
.total b{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:24px;color:var(--accent)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 14px;font-size:15px}
.chip:active{background:var(--accent-soft)}
.chip.add{border-style:dashed;color:var(--accent);border-color:var(--accent)}
.chip .x{margin-left:6px;color:var(--muted);border:0;background:none;padding:0 2px}

.exp-rows{display:flex;flex-direction:column;gap:8px}
.exp{display:flex;gap:8px;align-items:center}
.exp input.amt{width:112px}
.del{flex:none;width:36px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:18px}
.empty{font-size:14px;color:var(--muted);padding:4px 0}

.calc{display:flex;flex-direction:column;gap:2px;font-size:15px}
.line{display:flex;justify-content:space-between}
.line b{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:500}
.line.strong{border-top:1px solid var(--line);padding-top:4px;margin-top:2px;font-weight:700}
.line.strong b{font-weight:700}
.diff{display:flex;justify-content:space-between;align-items:center;border-radius:10px;padding:8px 12px;background:var(--paper);font-weight:700}
.diff b{font-family:var(--font-num);font-size:20px}
.diff.pos b{color:var(--pos)}
.diff.neg b{color:var(--neg)}
.save-state{font-size:12px;color:var(--muted);text-align:center}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile small{display:block;font-size:12px;color:var(--muted)}
.tile b{display:block;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:21px;line-height:1.3}
.tile.hero{grid-column:1/-1;border-color:var(--accent)}
.tile.hero b{font-size:28px}
.tile b.neg{color:var(--neg)}
.tile b.pos{color:var(--pos)}

.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:5.5em 1fr auto;gap:8px;align-items:center;font-size:14px}
.bar-row .name{overflow-wrap:anywhere}
.bar{height:10px;background:var(--paper);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar-row .v{font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bar-row .v small{color:var(--muted);font-size:11px;margin-left:4px}

.table-wrap{overflow-x:auto;margin:0 -14px;padding:0 14px}
table.ledger{border-collapse:collapse;font-size:13px;min-width:100%;white-space:nowrap}
.ledger th{font-weight:500;color:var(--accent);text-align:right;padding:6px 8px;border-bottom:2px solid var(--accent);position:sticky;top:0;background:var(--card)}
.ledger th:first-child,.ledger td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.ledger td{padding:6px 8px;text-align:right;border-bottom:1px dashed var(--line);font-family:var(--font-num);font-variant-numeric:tabular-nums}
.ledger td.memo{text-align:left;font-family:var(--font-body);max-width:14em;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.ledger tr.blank td{color:var(--muted);opacity:.6}
.ledger tr.we td:first-child{color:var(--neg)}
.ledger tbody tr{cursor:pointer}
.ledger tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.cash-row{background:var(--accent-soft);margin:0 -14px;padding:10px 14px;border-bottom:0}
.cash-row>span{flex-direction:row}
.cash-row small{font-size:11px;width:100%}
.cash-row b.num{font-size:20px;color:var(--accent)}
.cash-row b.num.neg{color:var(--neg)}
.row small.hint{margin-left:2px}
select.role{font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);max-width:100%}
.import-btn{font-size:13px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:4px 12px;cursor:pointer;white-space:nowrap}
.hint.imported{color:var(--pos)}
.detail-line{font-size:12px;color:var(--muted);padding:0 0 6px;margin-top:-4px;font-family:var(--font-num)}
.pf{display:flex;flex-direction:column;gap:2px;padding:6px 0;border-bottom:1px dashed var(--line)}
.pf:last-of-type{border-bottom:0}
.po-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--line);font-size:15px}
.po-item small{display:block;font-size:12px;color:var(--muted)}
.warn-t{color:var(--neg)}
.ok-t{color:var(--pos)}
.po-form{display:flex;flex-direction:column;gap:8px;margin-top:8px;padding:10px;border-radius:12px;background:var(--paper)}
.po-dates{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.po-form .add-line{align-items:center}
.po-form .add-line .btn{flex:none;white-space:nowrap;padding:10px 14px}
.po-form .add-line input.amt{min-width:0}
.po-dates label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
.po-dates input{font-size:16px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%;min-width:0;max-width:100%;box-sizing:border-box}
.ledger td.pos{color:var(--pos)}
.ledger td.neg{color:var(--neg)}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:16px;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1}

.ch-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.ch-row:last-child{border-bottom:0}
.ch-opts{grid-column:1/-1;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.ch-opts label{display:flex;align-items:center;gap:4px}
.ch-opts input{width:18px;height:18px;accent-color:var(--accent)}
.mini{border:1px solid var(--line);background:transparent;border-radius:8px;height:36px;min-width:36px;color:var(--muted)}
.add-line{display:flex;gap:8px}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;max-width:186px;border:0;background:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:13px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}

.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:calc(100% - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1 id="pageTitle">每日日結</h1><span id="sync" class="sync">連線中…</span></div>
    <div id="nav"></div>
  </header>
  <main id="main">
    <div id="notice" hidden></div>
    <div id="view-day"></div>
    <div id="view-month" hidden></div>
    <div id="view-settings" hidden></div>
  </main>
  <nav class="tabs" aria-label="分頁">
    <button id="tab-day" data-tab="day" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>每日記帳</button>
    <button id="tab-month" data-tab="month">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15v2"/><path d="M11 11v6"/><path d="M15 7v10"/><path d="M19 12v5"/></svg>月報表</button>
    <button id="tab-settings" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/><circle cx="9" cy="6" r="2" fill="var(--card)"/><circle cx="15" cy="12" r="2" fill="var(--card)"/><circle cx="7" cy="18" r="2" fill="var(--card)"/></svg>設定</button>
  </nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="qcFile" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>

<script>
(function(){
'use strict';

/* ---------- defaults ---------- */
/* role: qcTotal = 快一點總營業額；inQc = 已包含在快一點總額內、扣掉才是現金；extra = 另外收的，加進總營業額 */
const ROLE_LABEL = {qcTotal:'快一點總營業額', inQc:'包含在快一點總額內（扣掉才是現金）', extra:'另外收的（加進總營業額）'};
const DEFAULT_SETTINGS = {
  version: 7,
  float: 0,
  channels: [
    {id:'qcTotal',  name:'快一點總營業額', role:'qcTotal'},
    {id:'qcOnline', name:'線上支付', role:'inQc'},
    {id:'line',     name:'LINE Pay', role:'inQc', manual:true},
    {id:'jko',      name:'街口支付', role:'inQc', manual:true},
    {id:'panda',    name:'foodpanda 訂單金額', role:'extra'}
  ],
  items: ['菜','牛','肉','冰','豆','蛋','米','雜貨','瓦斯','包材']
};
const FIXED_SUGGEST = ['薪水','房租','水電','勞健保','平台月費'];
const WD = '日一二三四五六';

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n==null||isNaN(n)) ? '0' : Math.round(n).toLocaleString('en-US');
const fmtS = n => (n>0?'+':n<0?'−':'±') + fmt(Math.abs(n));
const parseAmt = v => { const s = String(v==null?'':v).replace(/[^\d]/g,''); return s==='' ? null : parseInt(s,10); };
const showAmt = v => (v==null||v==='') ? '' : String(v);
const isoOf = dt => dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
const todayIso = () => isoOf(new Date());
const parts = iso => { const [y,m,d] = iso.split('-').map(Number); return {y,m,d}; };
const addDays = (iso,n) => { const p = parts(iso); return isoOf(new Date(p.y,p.m-1,p.d+n)); };
const daysIn = ym => { const [y,m] = ym.split('-').map(Number); return new Date(y,m,0).getDate(); };
const shiftYM = (ym,n) => { const [y,m] = ym.split('-').map(Number); const d = new Date(y,m-1+n,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); };
const rocYM = ym => { const [y,m] = ym.split('-').map(Number); return (y-1911)+'年'+m+'月'; };
const rocDate = iso => { const p = parts(iso); const w = new Date(p.y,p.m-1,p.d).getDay(); return (p.y-1911)+'年'+p.m+'月'+p.d+'日（'+WD[w]+'）'; };
const uid = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const clone = o => JSON.parse(JSON.stringify(o));

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2600); }

/* ---------- storage backends ---------- */
function cloudStore(db){
  const mapErr = (err) => err;
  return {
    kind:'cloud',
    subSettings(cb, err){ return db.doc('config/settings').onSnapshot(s => cb(s.exists ? s.data() : null, s.metadata), e => err && err(mapErr(e))); },
    saveSettings(d){ return db.doc('config/settings').set(d); },
    subMonth(ym, cb, err){ return db.collection('months/'+ym+'/days').onSnapshot(q => { const o = {}; q.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); }); cb(o, q.metadata); }, e => err && err(e)); },
    saveDay(ym, dd, d){ return db.doc('months/'+ym+'/days/'+dd).set(d); },
    subFixed(ym, cb, err){ return db.doc('months/'+ym+'/meta/fixed').onSnapshot(s => cb(s.exists ? s.data() : null, s.metadata), e => err && err(e)); },
    saveFixed(ym, d){ return db.doc('months/'+ym+'/meta/fixed').set(d); }
  };
}
function localStore(){
  const mem = {};
  let ls = null;
  try { localStorage.setItem('__rbk','1'); localStorage.removeItem('__rbk'); ls = localStorage; } catch(e) { ls = null; }
  const get = k => { if (ls) { try { const v = ls.getItem('rbk:'+k); if (v) return JSON.parse(v); } catch(e){} } return mem[k] == null ? null : clone(mem[k]); };
  const put = (k,v) => { mem[k] = clone(v); if (ls) { try { ls.setItem('rbk:'+k, JSON.stringify(v)); } catch(e){} } };
  const subs = {};
  const notify = k => (subs[k]||[]).forEach(f => f());
  const sub = (k,f) => { (subs[k] = subs[k]||[]).push(f); setTimeout(f,0); return () => { subs[k] = (subs[k]||[]).filter(x => x !== f); }; };
  const meta = {fromCache:false, hasPendingWrites:false};
  return {
    kind:'local', persistent: !!ls,
    subSettings(cb){ return sub('settings', () => cb(get('settings'), meta)); },
    saveSettings(d){ put('settings', d); notify('settings'); return Promise.resolve(); },
    subMonth(ym, cb){ return sub('m:'+ym, () => cb(get('m:'+ym)||{}, meta)); },
    saveDay(ym, dd, d){ const m = get('m:'+ym)||{}; m[dd] = d; put('m:'+ym, m); notify('m:'+ym); return Promise.resolve(); },
    getMonthSync(ym){ return get('m:'+ym) || {}; },
    migrateDays(fn){
      if (!ls) return;
      const keys = []; for (let i = 0; i < ls.length; i++) { const k = ls.key(i); if (k && k.startsWith('rbk:m:')) keys.push(k.slice(4)); }
      keys.forEach(k => { const m = get(k) || {}; let any = false; Object.keys(m).forEach(dd => { if (fn(m[dd])) any = true; }); if (any) { put(k, m); notify(k); } });
    },
    getKey(k){ return get('k:'+k); },
    setKey(k, v){ put('k:'+k, v); notify('k:'+k); return Promise.resolve(); },
    mergeDays(ym, patchFn){ const m = get('m:'+ym)||{}; const out = patchFn(m) || m; put('m:'+ym, out); notify('m:'+ym); return Promise.resolve(); },
    subFixed(ym, cb){ return sub('f:'+ym, () => cb(get('f:'+ym), meta)); },
    saveFixed(ym, d){ put('f:'+ym, d); notify('f:'+ym); return Promise.resolve(); }
  };
}

/* ---------- state ---------- */
const S = {
  store:null, downloads:null, readOnly:false,
  settings: clone(DEFAULT_SETTINGS),
  tab:'day',
  date: todayIso(),
  ym: null,
  days: {}, monthLoaded:false, monthStale:false,
  fixed: {items:[]},
  draft: null, draftDate:null,
  dirtyDay:false, dirtyVer:0, savingDay:false, dayTimer:null,
  fixedDirty:false, fixedTimer:null, fixedSaving:false,
  setDirty:false, setTimer:null,
  saveMsg:''
};
let unsubMonth = null, unsubFixed = null, monthTimer = null;

/* ---------- write helpers ---------- */
async function writeWithRetry(fn){
  try { return await fn(); }
  catch(e){
    const code = e && e.code;
    if (code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random()*600)); return fn(); }
    throw e;
  }
}
function handleWriteError(e){
  const code = e && e.code;
  if (code === 'invalid_argument') { S.readOnly = true; showNotice('你目前只能查看，不能修改資料。請擁有者把這個頁面分享給你時，給可以編輯資料的權限。', true); }
  else if (code === 'quota_exceeded') { toast('資料空間已滿，暫時無法新增'); }
  else { toast('沒存到，請檢查網路後再改一次'); }
}
function showNotice(msg, warn){ const n = $('#notice'); n.hidden = false; n.className = 'banner' + (warn?' warn':''); n.textContent = msg; }

/* ---------- day draft ---------- */
function emptyDay(date){ return {date, rev:{}, exp:[], cashCounted:null, note:''}; }
function loadDraft(){
  const dd = S.date.slice(8);
  const src = S.days[dd];
  S.draft = src ? Object.assign(emptyDay(S.date), clone(src)) : emptyDay(S.date);
  if (!Array.isArray(S.draft.exp)) S.draft.exp = [];
  if (!S.draft.rev || typeof S.draft.rev !== 'object') S.draft.rev = {};
  S.draftDate = S.date;
}
function dayCalc(d){
  const ch = S.settings.channels;
  let qc = 0, inQc = 0, extra = 0;
  ch.forEach(c => { const v = Number(d.rev && d.rev[c.id]) || 0; if (c.role === 'qcTotal') qc += v; else if (c.role === 'inQc') inQc += v; else extra += v; });
  const cashRev = qc - inQc;
  const total = qc + extra;
  const exp = (d.exp||[]).reduce((a,e) => a + (Number(e.amt)||0), 0);
  const float = dayFloat(d);
  const expect = float + cashRev - exp;
  const counted = d.cashCounted == null ? null : Number(d.cashCounted);
  return {total, qc, inQc, extra, cashRev, exp, float, expect, counted, diff: counted == null ? null : counted - expect};
}
function dayFloat(d){ return (d && d.float != null) ? Number(d.float) : (Number(S.settings.float) || 0); }
/* Breakdown rows that add up to the total: computed cash, then each inQc and extra channel */
function revParts(){
  const ch = S.settings.channels;
  return [{id:'__cash', name:'現金（快一點扣線上）'}].concat(ch.filter(c => c.role !== 'qcTotal').map(c => ({id:c.id, name:c.name})));
}
function partVal(d, c, id){
  if (id === '__cash') return c.cashRev;
  return Number(d.rev && d.rev[id]) || 0;
}
function dayHasData(d){
  return Object.values(d.rev||{}).some(v => v != null && v !== '') || (d.exp||[]).some(e => e.amt || (e.item||'').trim()) || d.cashCounted != null || (d.note||'').trim();
}
function scheduleDaySave(){
  if (S.readOnly) return;
  S.dirtyDay = true; S.dirtyVer++;
  setSaveMsg('尚未儲存…');
  clearTimeout(S.dayTimer);
  S.dayTimer = setTimeout(flushDay, 700);
}
async function flushDay(){
  clearTimeout(S.dayTimer);
  if (!S.dirtyDay || !S.store || !S.draft) return;
  if (S.savingDay) { S.dayTimer = setTimeout(flushDay, 300); return; }
  const d = S.draft, ym = d.date.slice(0,7), dd = d.date.slice(8);
  const ver = S.dirtyVer;
  const rev = {};
  Object.keys(d.rev||{}).forEach(k => { if (d.rev[k] != null && d.rev[k] !== '') rev[k] = Number(d.rev[k]); });
  const exp = (d.exp||[]).filter(e => e.amt || (e.item||'').trim()).map(e => ({item:(e.item||'').trim(), amt: e.amt == null ? 0 : Number(e.amt)}));
  const doc = {date:d.date, rev, exp, float: dayFloat(d), cashCounted: d.cashCounted == null ? null : Number(d.cashCounted), note: (d.note||'').trim(), updatedAt: new Date().toISOString()};
  if (!S.days[dd] && !dayHasData(doc)) { S.dirtyDay = false; setSaveMsg(''); return; }
  S.savingDay = true; setSaveMsg('儲存中…');
  try {
    await writeWithRetry(() => S.store.saveDay(ym, dd, doc));
    if (S.dirtyVer === ver) { S.dirtyDay = false; setSaveMsg('已儲存 ' + new Date().toTimeString().slice(0,5)); }
  } catch(e) { handleWriteError(e); setSaveMsg('沒存到'); }
  finally { S.savingDay = false; }
}
function setSaveMsg(m){ S.saveMsg = m; const el = $('#saveState'); if (el) el.textContent = m; }

/* ---------- subscriptions ---------- */
function setYM(ym){
  if (ym === S.ym) return;
  if (unsubMonth) unsubMonth(); if (unsubFixed) unsubFixed();
  S.ym = ym; S.days = {}; S.monthLoaded = false; S.monthStale = false; S.fixed = {items:[]};
  clearTimeout(monthTimer);
  monthTimer = setTimeout(() => { if (!S.monthLoaded) { S.monthStale = true; renderSync(); } }, 10000);
  unsubMonth = S.store.subMonth(ym, (o, meta) => {
    if (ym !== S.ym) return;
    S.days = o || {};
    if (!meta || !meta.fromCache) { S.monthLoaded = true; S.monthStale = false; clearTimeout(monthTimer); }
    onMonthData();
  }, (e) => { clearTimeout(monthTimer); S.monthStale = true; renderSync(); });
  unsubFixed = S.store.subFixed(ym, (d) => {
    if (ym !== S.ym) return;
    if (S.fixedDirty || S.fixedSaving || focusedIn('#view-month .fixed-box') || focusedIn('#view-month .payout-box')) return;
    S.fixed = d && Array.isArray(d.items) ? Object.assign({payouts:{}}, d) : {items:[], payouts:{}};
    if (S.tab === 'month') renderMonth();
  }, () => {});
}
function focusedIn(sel){ const a = document.activeElement; const box = document.querySelector(sel); return !!(a && box && box.contains(a) && a.tagName !== 'BUTTON'); }
function onMonthData(){
  renderNav(); renderSync();
  if (S.tab === 'day') {
    if (S.draftDate !== S.date) { loadDraft(); renderDay(); return; }
    if (!S.dirtyDay && !S.savingDay && !focusedIn('#view-day')) {
      const before = JSON.stringify(S.draft);
      loadDraft();
      if (JSON.stringify(S.draft) !== before) renderDay();
    }
  } else if (S.tab === 'month') {
    renderMonth();
  }
}

/* ---------- navigation ---------- */
async function goDate(iso){
  await flushDay();
  S.date = iso;
  setYM(iso.slice(0,7));
  loadDraft();
  renderNav(); renderDay();

async function setTab(t){
  if (S.tab === 'day' && t !== 'day') await flushDay();
  S.tab = t;
  ['day','month','settings'].forEach(x => {
    $('#view-'+x).hidden = x !== t;
    const b = $('#tab-'+x); if (x === t) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  $('#pageTitle').textContent = t === 'day' ? '每日日結' : t === 'month' ? '月報表' : '設定';
  if (t === 'day') { if (S.draftDate !== S.date) loadDraft(); renderDay(); }
  if (t === 'month') renderMonth();
  if (t === 'settings') renderSettings();
  renderNav();
  window.scrollTo(0,0);
}

/* ---------- month data ---------- */
function monthStats(){
  const ym = S.ym, n = daysIn(ym), ch = S.settings.channels;
  const rows = [];
  const byCh = {__cash:0}; ch.forEach(c => byCh[c.id] = 0);
  const byItem = {};
  let rev = 0, exp = 0, diff = 0, recorded = 0, diffDays = 0;
  for (let i = 1; i <= n; i++) {
    const dd = pad(i), iso = ym + '-' + dd, d = S.days[dd];
    const p = parts(iso); const w = new Date(p.y,p.m-1,p.d).getDay();
    if (!d) { rows.push({iso, dd, w, d:null}); continue; }
    recorded++;
    const c = dayCalc(d);
    rev += c.total; exp += c.exp;
    if (c.diff != null) { diff += c.diff; diffDays++; }
    ch.forEach(cc => byCh[cc.id] += Number(d.rev && d.rev[cc.id]) || 0);
    byCh.__cash += c.cashRev;
    (d.exp||[]).forEach(e => { const k = (e.item||'').trim() || '未填品項'; byItem[k] = byItem[k] || {amt:0, n:0}; byItem[k].amt += Number(e.amt)||0; byItem[k].n++; });
    rows.push({iso, dd, w, d, c});
  }
  const fixedItems = (S.fixed.items||[]).filter(f => (f.name||'').trim() || f.amt);
  const fixed = fixedItems.reduce((a,f) => a + (Number(f.amt)||0), 0);
  const items = Object.entries(byItem).map(([k,v]) => ({name:k, amt:v.amt, n:v.n})).sort((a,b) => b.amt - a.amt);
  const allPo = loadPayouts();
  const platforms = S.settings.channels.filter(c => c.role === 'extra').map(c => {
    const gross = byCh[c.id] || 0;
    const list = allPo.filter(p => p.ch === c.id && p.from.slice(0,7) <= ym && p.to.slice(0,7) >= ym).map(p => Object.assign({}, p, payoutCalc(p)));
    const fee = list.reduce((a,p) => a + (p.gross ? p.fee * (p.byMonth[ym] || 0) / p.gross : 0), 0);
    return {id:c.id, name:c.name, gross, list, fee: Math.round(fee), has: list.length > 0};
  });
  const platFee = platforms.reduce((a,p) => a + p.fee, 0);
  return {n, rows, byCh, items, rev, exp, fixed, fixedItems, platforms, platFee, diff, diffDays, recorded, net: rev - exp - fixed - platFee};
}

/* ---------- 外送平台撥款 ---------- */
function loadPayouts(){ try { const v = S.store && S.store.getKey ? S.store.getKey('payouts') : null; return Array.isArray(v) ? v : []; } catch(e) { return []; } }
function mdLabel(iso){ const p = parts(iso); return p.m + '/' + p.d; }
/* Sum a channel's order amounts from `from` to `to` (inclusive), also per month, counting days with nothing entered */
function payoutCalc(p){
  let gross = 0, missing = 0; const byMonth = {};
  const cache = {};
  for (let d = p.from, guard = 0; d <= p.to && guard < 400; d = addDays(d,1), guard++) {
    const ym = d.slice(0,7);
    const m = cache[ym] || (cache[ym] = (ym === S.ym ? S.days : (S.store.getMonthSync ? S.store.getMonthSync(ym) : {})) || {});
    const day = m[d.slice(8)];
    const v = day && day.rev && day.rev[p.ch];
    if (v == null || v === '') missing++;
    const n = Number(v) || 0; gross += n; byMonth[ym] = (byMonth[ym] || 0) + n;
  }
  return {gross, missing: p.fromStatement ? 0 : missing, byMonth, fee: gross - (Number(p.amount) || 0)};
}
function nextPayoutRange(ch){
  const last = loadPayouts().filter(p => p.ch === ch).sort((a,b) => a.to < b.to ? 1 : -1)[0];
  const from = last ? addDays(last.to, 1) : S.ym + '-01';
  return {from, to: addDays(from, 13)};
}
async function addPayout(ch){
  const from = $('#pof-'+ch).value, to = $('#pot-'+ch).value, amount = parseAmt($('#poa-'+ch).value);
  if (!from || !to) { toast('請填撥款涵蓋的日期'); return; }
  if (from > to) { toast('「從」的日期要在「到」之前'); return; }
  if (!amount) { toast('請填匯進來的金額'); $('#poa-'+ch).focus(); return; }
  const list = loadPayouts();
  if (list.some(p => p.ch === ch && !(p.to < from || p.from > to))) { if (!window.confirm('這段日期跟之前記的撥款有重疊，確定要再記一筆嗎？')) return; }
  list.push({id: uid(), ch, from, to, amount, createdAt: new Date().toISOString()});
  await S.store.setKey('payouts', list);
  renderMonth(); toast('已記下這筆撥款');
}

/* ---------- 快一點報表匯入 ---------- */
/* Which inQc channel a 快一點 交易型態 goes to: the channel listing it in `match`, else the catch-all inQc channel (no match list) */
function payTypeChannel(k){
  const inQc = S.settings.channels.filter(c => c.role === 'inQc');
  const hit = inQc.find(c => !c.manual && Array.isArray(c.match) && c.match.includes(k));
  if (hit) return hit.id;
  const all = inQc.find(c => !c.manual && (!Array.isArray(c.match) || !c.match.length));
  return all ? all.id : (inQc[0] && inQc[0].id);
}
function firstInQcId(){ const c = S.settings.channels.find(x => x.role === 'inQc'); return c ? c.id : null; }
function qcTotalId(){ const c = S.settings.channels.find(x => x.role === 'qcTotal'); return c ? c.id : null; }
/* Reads the 訂單列表 export: one row per item, order fields repeated. Groups by 訂單ID, skips cancelled orders,
   dates by 下單時間, cash = 交易型態「現金結帳」, everything else counts as online. */
function parseQcReport(rows){
  let h = rows.findIndex(r => Array.isArray(r) && r.includes('訂單ID'));
  if (h < 0) throw new Error('找不到「訂單ID」欄位');
  const H = rows[h]; const col = n => H.indexOf(n);
  const ci = {id:col('訂單ID'), pay:col('交易型態'), amt:col('總金額'), time:col('下單時間'), cancel:col('是否已取消'), plat:col('點餐平台')};
  if (ci.pay < 0 || ci.amt < 0 || ci.time < 0) throw new Error('報表欄位不完整');
  const seen = new Set(); const days = {};
  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i]; if (!r || r[ci.id] == null || r[ci.id] === '') continue;
    const id = String(r[ci.id]); if (seen.has(id)) continue; seen.add(id);
    if (ci.cancel >= 0 && String(r[ci.cancel]).trim() === '是') continue;
    let iso = null; const t = r[ci.time];
    if (t instanceof Date) iso = isoOf(t);
    else { const m = String(t||'').match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/); if (m) iso = m[1] + '-' + pad(m[2]) + '-' + pad(m[3]); }
    if (!iso) continue;
    const amt = Number(r[ci.amt]) || 0;
    const pay = String(r[ci.pay] || '其他').trim();
    const d = days[iso] = days[iso] || {total:0, cash:0, detail:{}, orders:0};
    d.total += amt; d.orders++;
    if (pay === '現金結帳' || pay === '現金') d.cash += amt; else d.detail[pay] = (d.detail[pay] || 0) + amt;
  }
  return days;
}
async function importReport(file){
  if (!window.XLSX) { toast('Excel 元件還沒載入，請連上網路再試'); return; }
  let wb;
  try { wb = XLSX.read(await file.arrayBuffer(), {type:'array', cellDates:true}); }
  catch(e) { toast('打不開這個檔案，請選 Excel 檔'); return; }
  const sheets = wb.SheetNames.map(n => ({name:n, rows: XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:null})}));
  const hasHeader = (sh, key) => sh.rows.slice(0,5).some(r => Array.isArray(r) && r.some(v => String(v||'').trim() === key));
  const fp = sheets.find(sh => hasHeader(sh, 'foodpanda 應付(應收)金額'));
  if (fp) return importFoodpanda(sheets, fp);
  const qc = sheets.find(sh => hasHeader(sh, '訂單ID'));
  if (qc) return importQcFile(qc.rows);
  toast('認不出這個檔案，請選快一點「訂單列表」或 foodpanda 對帳單');
}
async function importQcFile(rows){
  let days;
  try { days = parseQcReport(rows); }
  catch(e) { toast('讀不懂這個檔案，請選快一點後台匯出的「訂單列表」報表'); return; }
  const list = Object.keys(days).sort();
  if (!list.length) { toast('報表裡沒有找到訂單'); return; }
  const totId = qcTotalId(), onId = payTypeChannel('__any__');
  if (!totId || !onId) { toast('請先到設定保留「快一點總營業額」和至少一個「包含在快一點總額內」的欄位'); return; }
  const inQcIds = S.settings.channels.filter(c => c.role === 'inQc' && !c.manual).map(c => c.id);
  const span = list[0].slice(5).replace('-','/') + ' 到 ' + list[list.length-1].slice(5).replace('-','/');
  if (!window.confirm('找到 ' + list.length + ' 天的訂單（' + span + '）。\n要把這幾天的「快一點總營業額」和「線上支付」換成報表的數字嗎？\n支出、現金盤點和 foodpanda 不會動。')) return;
  await flushDay();
  const byYM = {};
  list.forEach(iso => { (byYM[iso.slice(0,7)] = byYM[iso.slice(0,7)] || []).push(iso); });
  const now = new Date().toISOString();
  for (const ym of Object.keys(byYM)) {
    await S.store.mergeDays(ym, m => {
      byYM[ym].forEach(iso => {
        const dd = iso.slice(8), x = days[iso];
        const cur = m[dd] ? clone(m[dd]) : {date: iso, rev:{}, exp:[], cashCounted:null, note:'', float: Number(S.settings.float) || 0};
        cur.rev = cur.rev || {};
        cur.rev[totId] = x.total;
        inQcIds.forEach(id => { cur.rev[id] = 0; });
        Object.entries(x.detail).forEach(([k,v]) => { const id = payTypeChannel(k) || onId; cur.rev[id] = (cur.rev[id] || 0) + v; });
        cur.qcDetail = x.detail; cur.qcOrders = x.orders; cur.imported = true; cur.updatedAt = now;
        m[dd] = cur;
      });
      return m;
    });
  }
  S.draftDate = null;
  if (S.tab === 'day') { loadDraft(); renderDay(); renderNav(); } else if (S.tab === 'month') renderMonth();
  toast('已帶入 ' + list.length + ' 天的快一點營收');
}

/* foodpanda 撥款對帳單：附件1 每筆訂單（商品金額、促銷折扣、佣金、應付金額），附件2 其他費用（期租費、廣告曝光費）。
   撥款 = 附件1 應付合計 − 附件2 費用合計。foodpanda 自己出的「foodpanda 折扣」不扣店家的錢，不算進去。 */
function parseFoodpanda(sheets, fpSheet){
  const rows = fpSheet.rows; const h = rows.findIndex(r => Array.isArray(r) && r.includes('foodpanda 應付(應收)金額'));
  const H = rows[h].map(v => String(v||'').trim()); const col = n => H.indexOf(n);
  const n = v => { const x = parseFloat(String(v == null ? '' : v).replace(/[^\d.\-]/g,'')); return isNaN(x) ? 0 : x; };
  const c = {id:col('訂單編號'), date:col('訂單日期'), gross:col('商品金額'), promo:col('商家折扣_促銷折扣'), coupon:col('商家折扣_優惠券'), dfee:col('商家折扣_外送費'),
    comm:col('綜合佣金總額'), box:col('pandabox 曝光費用'), cust:col('指定顧客曝光費用'), bag:col('塑膠袋費用'), recv:col('商家已收金額'), undone:col('未完成訂單款項'), net:col('foodpanda 應付(應收)金額')};
  const toIso = v => { if (v instanceof Date) return isoOf(v); const m = String(v||'').match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/); return m ? m[1] + '-' + pad(m[2]) + '-' + pad(m[3]) : null; };
  const days = {}; const seen = new Set();
  const bd = {'店家促銷折扣':0, '佣金':0, '曝光費（訂單）':0};
  let net = 0, orders = 0;
  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i]; if (!r || !r[c.id]) continue;
    const id = String(r[c.id]); if (seen.has(id)) continue; seen.add(id);
    const iso = toIso(r[c.date]); if (!iso) continue;
    const g = n(r[c.gross]);
    const d = days[iso] = days[iso] || {gross:0, orders:0}; d.gross += g; d.orders++; orders++;
    bd['店家促銷折扣'] += n(r[c.promo]) + (c.coupon >= 0 ? n(r[c.coupon]) : 0) + (c.dfee >= 0 ? n(r[c.dfee]) : 0);
    bd['佣金'] += n(r[c.comm]);
    bd['曝光費（訂單）'] += (c.box >= 0 ? n(r[c.box]) : 0) + (c.cust >= 0 ? n(r[c.cust]) : 0);
    net += n(r[c.net]);
  }
  let other = 0; let period = null;
  sheets.filter(sh => sh !== fpSheet).forEach(sh => {
    const hh = sh.rows.findIndex(r => Array.isArray(r) && r.includes('項目') && r.includes('金額'));
    if (hh < 0) return;
    const HH = sh.rows[hh]; const ci = HH.indexOf('項目'), ca = HH.indexOf('金額'), cd = HH.indexOf('詳細資訊');
    for (let i = hh + 1; i < sh.rows.length; i++) {
      const r = sh.rows[i]; if (!r || !r[ci]) continue;
      const k = String(r[ci]).trim(), a = n(r[ca]);
      bd[k] = (bd[k] || 0) + a; other += a;
      const m = cd >= 0 && String(r[cd]||'').match(/(\d{1,2})\/(\d{1,2})\s*-\s*(\d{1,2})\/(\d{1,2})/);
      if (m && !period) period = m;
    }
  });
  const list = Object.keys(days).sort();
  if (!list.length) throw new Error('no orders');
  let from = list[0], to = list[list.length-1];
  if (period) {
    const y = from.slice(0,4);
    const f = y + '-' + pad(period[1]) + '-' + pad(period[2]), t = y + '-' + pad(period[3]) + '-' + pad(period[4]);
    if (f <= from && t >= to) { from = f; to = t; }
  }
  Object.keys(bd).forEach(k => { bd[k] = Math.round(bd[k]); if (!bd[k]) delete bd[k]; });
  return {days, from, to, orders, payout: Math.round(net - other), breakdown: bd};
}
async function importFoodpanda(sheets, fpSheet){
  let r;
  try { r = parseFoodpanda(sheets, fpSheet); } catch(e) { toast('讀不懂這份 foodpanda 對帳單'); return; }
  const ch = S.settings.channels.find(c => c.role === 'extra' && /panda|熊貓/i.test(c.name + c.id)) || S.settings.channels.find(c => c.role === 'extra');
  if (!ch) { toast('請先到設定加一個 foodpanda 的管道'); return; }
  const gross = Object.values(r.days).reduce((a,d) => a + d.gross, 0);
  const msg = 'foodpanda 對帳單 ' + mdLabel(r.from) + '～' + mdLabel(r.to) + '\n訂單 ' + r.orders + ' 筆，商品金額 ' + fmt(gross) + '\n實際撥款 ' + fmt(r.payout) + '（被扣 ' + fmt(gross - r.payout) + '）\n\n要把每天的 foodpanda 金額換成對帳單的數字，並記下這筆撥款嗎？';
  if (!window.confirm(msg)) return;
  await flushDay();
  const byYM = {}; Object.keys(r.days).forEach(iso => { (byYM[iso.slice(0,7)] = byYM[iso.slice(0,7)] || []).push(iso); });
  const now = new Date().toISOString();
  for (const ym of Object.keys(byYM)) {
    await S.store.mergeDays(ym, m => {
      byYM[ym].forEach(iso => {
        const dd = iso.slice(8), x = r.days[iso];
        const cur = m[dd] ? clone(m[dd]) : {date: iso, rev:{}, exp:[], cashCounted:null, note:'', float: Number(S.settings.float) || 0};
        cur.rev = cur.rev || {}; cur.rev[ch.id] = Math.round(x.gross); cur.pandaOrders = x.orders; cur.updatedAt = now;
        m[dd] = cur;
      });
      return m;
    });
  }
  const list = loadPayouts().filter(p => !(p.ch === ch.id && p.from === r.from && p.to === r.to));
  list.push({id: uid(), ch: ch.id, from: r.from, to: r.to, amount: r.payout, fromStatement: true, orders: r.orders, breakdown: r.breakdown, createdAt: now});
  await S.store.setKey('payouts', list);
  S.draftDate = null;
  const ym = r.to.slice(0,7);
  if (S.tab === 'month') { if (S.ym !== ym) { S.date = r.to; setYM(ym); renderNav(); } renderMonth(); }
  else if (S.tab === 'day') { loadDraft(); renderDay(); renderNav(); }
  toast('已匯入 foodpanda ' + mdLabel(r.from) + '～' + mdLabel(r.to) + '，撥款 ' + fmt(r.payout));
}

/* ---------- backup / restore (this phone only) ---------- */
function lsGet(k){ try { return localStorage.getItem(k); } catch(e) { return null; } }
function lastBackupRecent(){ const t = Number(lsGet('rbk-meta:lastBackup')) || 0; return Date.now() - t < 31*864e5; }
function lastBackupText(){ const t = Number(lsGet('rbk-meta:lastBackup')) || 0; if (!t) return '還沒備份過'; const d = new Date(t); return '上次備份 ' + (d.getMonth()+1) + '/' + d.getDate(); }
async function backup(){
  await flushDay(); await flushFixed();
  const out = {app:'restaurant-ledger', version:1, exportedAt:new Date().toISOString(), data:{}};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('rbk:')) out.data[k] = JSON.parse(localStorage.getItem(k)); } }
  catch(e) { toast('讀不到資料，備份失敗'); return; }
  const t = todayIso().replace(/-/g,'');
  await S.downloads.save({filename:'日結記帳備份_' + t + '.json', data: new Blob([JSON.stringify(out)], {type:'application/json'})});
  try { localStorage.setItem('rbk-meta:lastBackup', String(Date.now())); } catch(e) {}
  toast('已下載備份檔，請存到雲端硬碟或傳給自己');
  if (S.tab === 'settings') renderSettings();
}
function restore(file){
  const r = new FileReader();
  r.onload = () => {
    let obj; try { obj = JSON.parse(r.result); } catch(e) { toast('這不是備份檔，請選「日結記帳備份」開頭的檔案'); return; }
    if (!obj || obj.app !== 'restaurant-ledger' || !obj.data) { toast('這不是備份檔，請選「日結記帳備份」開頭的檔案'); return; }
    const months = Object.keys(obj.data).filter(k => k.startsWith('rbk:m:')).length;
    if (!window.confirm('要用這個備份（' + months + ' 個月的資料）取代手機上現在的資料嗎？')) return;
    try {
      Object.keys(localStorage).filter(k => k.startsWith('rbk:')).forEach(k => localStorage.removeItem(k));
      Object.entries(obj.data).forEach(([k,v]) => { if (k.startsWith('rbk:')) localStorage.setItem(k, JSON.stringify(v)); });
    } catch(e) { toast('還原失敗，手機空間可能不夠'); return; }
    location.reload();
  };
  r.readAsText(file);
}

/* ---------- events ---------- */
document.addEventListener('click', async (ev) => {
  const t = ev.target.closest('button, tr[data-go]');
  if (!t) return;
  const ds = t.dataset;
  if (ds.tab) { setTab(ds.tab); return; }
  if (ds.go) { await setTab('day'); goDate(ds.go); return; }
  switch (ds.act) {
    case 'prevDay': goDate(addDays(S.date,-1)); return;
    case 'nextDay': goDate(addDays(S.date,1)); return;
    case 'today': goDate(todayIso()); return;
    case 'prevMonth': case 'nextMonth': {
      const ym = shiftYM(S.ym, ds.act === 'prevMonth' ? -1 : 1);
      await flushFixed();
      const day = Math.min(parseInt(S.date.slice(8),10), daysIn(ym));
      S.date = ym === todayIso().slice(0,7) ? todayIso() : ym + '-' + pad(day);
      setYM(ym); renderNav(); renderMonth(); return;
    }
    case 'exportXlsx': exportXlsx(); return;
    case 'copyTsv': copyTsv(); return;
    case 'backup': backup(); return;
    case 'addCh': {
      const inp = $('#newCh'); const name = inp.value.trim(); if (!name) { inp.focus(); return; }
      S.settings.channels.push({id: uid(), name, role:'extra'}); scheduleSettingsSave(); renderSettings(); return;
    }
    case 'addItem': {
      const inp = $('#newItem'); const name = inp.value.trim(); if (!name) { inp.focus(); return; }
      if (!S.settings.items.includes(name)) S.settings.items.push(name); scheduleSettingsSave(); renderSettings(); $('#newItem').focus(); return;
    }
  }
  if (ds.addpo !== undefined) { addPayout(ds.addpo); return; }
  if (ds.delpo !== undefined) { delPayout(ds.delpo); return; }
  if (ds.additem !== undefined) {
    S.draft.exp.push({item: ds.additem, amt: null});
    renderExpRows(S.draft.exp.length - 1); updateDayTotals(); return;
  }
  if (ds.delexp !== undefined) {
    S.draft.exp.splice(Number(ds.delexp), 1); renderExpRows(); updateDayTotals(); scheduleDaySave(); return;
  }
  if (ds.addfixed !== undefined) {
    S.fixed.items = S.fixed.items || []; S.fixed.items.push({name: ds.addfixed, amt: null}); renderFixedRows(S.fixed.items.length - 1); return;
  }
  if (ds.delfixed !== undefined) {
    S.fixed.items.splice(Number(ds.delfixed), 1); renderFixedRows(); renderMonthSummary(); scheduleFixedSave(); return;
  }
  if (ds.chup !== undefined) {
    const i = Number(ds.chup); if (i < 1) return; const a = S.settings.channels; [a[i-1], a[i]] = [a[i], a[i-1]]; scheduleSettingsSave(); renderSettings(); return;
  }
  if (ds.chdel !== undefined) {
    if (S.settings.channels.length <= 1) { toast('至少要留一個管道'); return; }
    S.settings.channels.splice(Number(ds.chdel), 1); scheduleSettingsSave(); renderSettings(); return;
  }
  if (ds.itemdel !== undefined) {
    S.settings.items.splice(Number(ds.itemdel), 1); scheduleSettingsSave(); renderSettings(); return;
  }
});

document.addEventListener('input', (ev) => {
  const t = ev.target, ds = t.dataset;
  if (ds.rev !== undefined) { S.draft.rev[ds.rev] = parseAmt(t.value); cleanAmt(t); updateDayTotals(); scheduleDaySave(); return; }
  if (ds.expitem !== undefined) { S.draft.exp[Number(ds.expitem)].item = t.value; scheduleDaySave(); return; }
  if (ds.expamt !== undefined) { S.draft.exp[Number(ds.expamt)].amt = parseAmt(t.value); cleanAmt(t); updateDayTotals(); scheduleDaySave(); return; }
  if (t.id === 'dayFloat') { S.draft.float = parseAmt(t.value) == null ? 0 : parseAmt(t.value); cleanAmt(t); updateDayTotals(); scheduleDaySave(); return; }
  if (t.id === 'defFloat') { S.settings.float = parseAmt(t.value) || 0; cleanAmt(t); scheduleSettingsSave(); if (S.draft && !S.days[S.date.slice(8)] && S.draft.float == null) updateDayTotals(); return; }
  if (t.id === 'cashCounted') { S.draft.cashCounted = parseAmt(t.value); cleanAmt(t); updateDayTotals(); scheduleDaySave(); return; }
  if (t.id === 'note') { S.draft.note = t.value; scheduleDaySave(); return; }
  if (ds.fixname !== undefined) { S.fixed.items[Number(ds.fixname)].name = t.value; scheduleFixedSave(); return; }
  if (ds.fixamt !== undefined) { S.fixed.items[Number(ds.fixamt)].amt = parseAmt(t.value); cleanAmt(t); renderMonthSummary(); scheduleFixedSave(); return; }
  if (ds.chname !== undefined) { S.settings.channels[Number(ds.chname)].name = t.value; scheduleSettingsSave(); return; }
});
document.addEventListener('change', (ev) => {
  const t = ev.target, ds = t.dataset;
  if (t.id === 'datePick' && t.value) { goDate(t.value); return; }
  if (t.id === 'qcFile' && t.files && t.files[0]) { const f = t.files[0]; t.value = ''; importReport(f); return; }
  if (t.id === 'restoreFile' && t.files && t.files[0]) { restore(t.files[0]); t.value = ''; return; }
  if (ds.chrole !== undefined) { S.settings.channels[Number(ds.chrole)].role = t.value; scheduleSettingsSave(); return; }
});
document.addEventListener('keydown', (ev) => {
  if (ev.key !== 'Enter') return;
  if (ev.target.id === 'newCh') { ev.preventDefault(); document.querySelector('[data-act="addCh"]').click(); }
  if (ev.target.id === 'newItem') { ev.preventDefault(); document.querySelector('[data-act="addItem"]').click(); }
});
document.addEventListener('focusout', () => { setTimeout(() => { if (S.tab === 'day' && !focusedIn('#view-day') && !S.dirtyDay && S.draftDate === S.date) { /* pick up remote edits made while typing */ const before = JSON.stringify(S.draft); loadDraft(); if (JSON.stringify(S.draft) !== before) renderDay(); } }, 50); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { flushDay(); flushFixed(); } });
function cleanAmt(t){ const s = t.value.replace(/[^\d]/g,''); if (s !== t.value) t.value = s; }

/* ---------- start ---------- */
async function waitForClaude(ms){
  const t0 = Date.now();
  while (Date.now() - t0 < ms) { if (window.claude && typeof window.claude.use === 'function') return window.claude; await new Promise(r => setTimeout(r, 100)); }
  return null;
}
const nativeDownloads = {
  save({filename, data}){
    return new Promise((resolve, reject) => {
      try {
        const blob = data instanceof Blob ? data : new Blob([data]);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        resolve({status:'saved'});
      } catch(e) { reject({code:'unavailable', message:String(e)}); }
    });
  }
};
async function init(){
  loadDraft(); renderNav(); renderDay(); renderSync();
  S.store = localStore();
  S.downloads = nativeDownloads;
  if (!S.store.persistent) showNotice('這個瀏覽器不能存資料（可能開了無痕模式），重新整理就會不見。請用一般模式打開。', true);
  else if (!lastBackupRecent()) showNotice('資料只存在這支手機。每個月記得到「月報表」匯出 Excel，或到「設定」備份一次。', false);
  S.store.subSettings((d) => {
    if (S.setDirty) return;
    const items = (d && Array.isArray(d.items)) ? d.items : clone(DEFAULT_SETTINGS.items);
    let chs = null, migrated = false;
    if (d && d.version === 7 && Array.isArray(d.channels) && d.channels.length) chs = d.channels;
    else if (d && d.version >= 3 && d.version <= 6 && Array.isArray(d.channels) && d.channels.length) {
      const base = d.channels.filter(c => !['qcOnline','line','jko'].includes(c.id));
      const at = Math.max(0, base.findIndex(c => c.role === 'qcTotal') + 1);
      base.splice(at, 0, clone(DEFAULT_SETTINGS.channels[1]), clone(DEFAULT_SETTINGS.channels[2]), clone(DEFAULT_SETTINGS.channels[3]));
      chs = base; migrated = true;
    }
    S.settings = chs
      ? {version:7, float: Number(d.float) || 0, channels: chs.map(c => Object.assign({role:'extra'}, c)), items}
      : Object.assign(clone(DEFAULT_SETTINGS), {items, float: (d && Number(d.float)) || 0});
    if (migrated) {
      /* 舊版把 Apple Pay 等放在 qcOnline、把報表的「線上支付／櫃檯結帳」放在街口；街口現在是另一個 APP（另外收），所以搬到 LINE Pay（快一點線上付款） */
      /* 線上支付＝報表裡所有非現金（含快一點線上的 LINE Pay）；LINE Pay、街口改成櫃檯手動填。舊版匯入時放進 LINE Pay／街口的數字收回線上支付 */
      if (S.store.migrateDays) S.store.migrateDays(day => {
        const r = day.rev || {};
        if (day.imported && day.qcDetail) {
          r.qcOnline = Object.values(day.qcDetail).reduce((a,v) => a + (Number(v) || 0), 0);
          delete r.line;
          if (d.version === 4) delete r.jko;
          day.rev = r; return true;
        }
        if (d.version === 5 && r.line != null && r.qcOnline == null) { r.qcOnline = r.line; delete r.line; day.rev = r; return true; }
        return false;
      });
      S.store.saveSettings(clone(S.settings));
    }
    if (S.tab === 'settings' && !focusedIn('#view-settings')) renderSettings();
    if (S.tab === 'day' && !focusedIn('#view-day')) renderDay();
    if (S.tab === 'month') renderMonth();
  }, () => {});
  S.ym = null; setYM(S.date.slice(0,7));
  renderSync();
}
init();
})();
